name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: stratusadv/github-actions/linting@v1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          template-lint: 'false'

      - name: Install dependencies
        run: uv sync --extra development

      - name: Lint
        run: uv run ruff check limelight tests

      - name: Types
        run: uv run ty check limelight tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: linting
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra development --python ${{ matrix.python-version }}

      - name: Install chromium
        run: uv run --python ${{ matrix.python-version }} playwright install --with-deps chromium

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: stratusadv/github-actions/security@v1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          sync-extras: ''
