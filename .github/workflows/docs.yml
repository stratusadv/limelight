name: docs

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Build
              run: uv run --locked --only-group docs zensical build --strict

            - if: github.event_name == 'push'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: site

    deploy:
        if: github.event_name == 'push'
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            id-token: write
            pages: write
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
