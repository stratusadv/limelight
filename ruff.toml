indent-width = 4
line-length = 100
src = ["examples", "limelight", "tests"]
target-version = "py311"

exclude = [
    "*/migrations/*",
    "/site",
    ".DS_Store",
    ".eggs",
    ".git",
    ".hg",
    ".hypothesis",
    ".idea",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pybuilder",
    ".pytest_cache",
    ".pyre",
    ".pytype",
    ".ropeproject",
    ".scrapy",
    ".svn",
    ".tox",
    ".venv",
    ".venv*",
    ".venv_*",
    ".webassets-cache",
    "__pycache__",
    "__pypackages__",
    "build",
    "cover",
    "CVS",
    "develop-eggs",
    "dist",
    "docs/_build",
    "downloads",
    "eggs",
    "htmlcov",
    "instance",
    "lib",
    "lib64",
    "migrations",
    "node_modules",
    "parts",
    "profile_default",
    "sdist",
    "share/python-wheels",
    "target",
    "tmp/cache",
    "var",
    "venv",
    "venv*",
    "venv_*",
    "venv.bak",
    "wheels",
]

[format]
indent-style = "space"
quote-style = "single"

[lint]
preview = true
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "DOC",
    "I001",
    "ISC001",
    "SIM102",
    "UP035",
]

[lint.flake8-quotes]
inline-quotes = "single"

[lint.per-file-ignores]
"examples/*" = [
    "INP001",
]
"limelight/capture/sinks.py" = [
    "S404",
]
"limelight/ffmpeg.py" = [
    "S404",
    "S603",
]
"limelight/pytest_plugin.py" = [
    "pytest-fixture-autouse",
]
"scripts/*" = [
    "INP001",
]
"tests/*" = [
    "INP001",
    "PLC2701",
    "PLR2004",
    "S101",
    "SLF001",
]
"tests/test_capture_sinks.py" = [
    "S404",
]
"tests/test_ffmpeg.py" = [
    "S404",
]

[lint.pylint]
max-args = 8
max-public-methods = 22
