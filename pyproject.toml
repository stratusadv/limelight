[build-system]
requires = ['uv_build>=0.12.7,<0.13']
build-backend = 'uv_build'

[project]
name = "playwright-limelight"
version = "0.3.0"
description = "Narrated Playwright demos that double as silent end-to-end tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brayden Carlson" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.49",
    "typing-extensions>=4.12",
]

[project.scripts]
limelight-render = "limelight.export.cli:main"

[project.optional-dependencies]
django = [
    "django>=4",
    "pytest-django>=4.9",
]

pytest = [
    "pytest>=8.0",
    "pytest-playwright>=0.7",
]

development = [
    "django>=4",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-playwright>=0.7",
    "ruff==0.17.3",
    "ty==0.0.96",
]

[dependency-groups]
docs = [
    "mkdocstrings-python==2.0.10",
    "typing-extensions>=4.12",
    "zensical==0.1.0",
]

[tool.uv.build-backend]
module-name = 'limelight'
module-root = ''

[tool.pytest.ini_options]
markers = [
    "browser: drives overlay.js in a real chromium; skips itself when no browser is installed",
]
pythonpath = ["tests"]
testpaths = ["tests"]
