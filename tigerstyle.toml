extend-exclude = [
    "limelight/overlay/assets/overlay.js",
    "limelight/scripts/*.js",
]
ignore = [
    "TS016",
    "TS022",
    "TS037",
]
preview = true
select = ["ALL"]

[extend-per-file-ignores]
"build.ts" = ["TS004", "TS032"]
"eslint.config.ts" = ["TS004", "TS025", "TS032"]
